services:
  # PostgreSQL database with the pgvector extension (stores vectors for RAG)
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432" # 5433 on your computer, so it won't clash with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FastAPI backend
  backend:
    build: ./backend
    env_file: .env
    environment:
      # Inside Docker the database host is the service name "db", port 5432
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${BACKEND_PORT:-8000}:8000" # change BACKEND_PORT in .env if 8000 is busy
    volumes:
      - uploads:/app/uploads # keeps uploaded PDFs when the container is rebuilt
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
